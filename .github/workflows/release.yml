name: Release

# Tag-driven publishing: push a tag like `v0.1.0-preview.6` and this
# (1) packs every packable project in the solution and pushes to NuGet.org,
# (2) publishes SELF-CONTAINED single-file `queuey` CLI binaries per
#     architecture and attaches them to a GitHub Release — the install path
#     for any machine with no .NET runtime at all: a Pi or a gateway, and just
#     as often a JavaScript developer's laptop running the agent-setup prompt
#     (`dotnet tool install` requires the SDK; neither usually has it).
#     Each binary is attached twice: versioned (queuey-0.1.0-preview.8-osx-arm64.tar.gz)
#     and under a stable name (queuey-osx-arm64.tar.gz), so that
#     releases/latest/download/queuey-<rid>.tar.gz is one URL the docs can hand
#     out that never goes stale.
#
# The version comes from the tag (overrides Directory.Build.props), so a
# release is exactly one `git tag && git push --tags`.
#
# NuGet.org is reached through Trusted Publishing (OIDC): the job asks GitHub
# for a short-lived token, exchanges it at nuget.org for an API key that lives
# one hour, and pushes with that. No long-lived key is stored in this repo.
#
# The exchange only succeeds while a matching trusted publishing policy exists
# on nuget.org: owner Queuey-AI, repository queuey-client, workflow release.yml,
# no environment, scoped to the glob `Queuey.*`.
#
# Required variable: NUGET_USER (the nuget.org account name that registered the
# policy — a profile name, never an email address).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release + upload assets

jobs:
  nuget:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # let GitHub mint the OIDC token nuget.org trades for a key
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Resolve version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test (the gate travels with the release)
        run: dotnet test Queuey.Client.sln --configuration Release

      - name: Pack
        run: dotnet pack Queuey.Client.sln --configuration Release -o artifacts -p:Version=$VERSION

      # The key expires an hour after it is issued, so it is fetched here —
      # after the slow test and pack steps — rather than at the top of the job.
      - name: NuGet login (OIDC exchange)
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  cli-binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64, osx-arm64, osx-x64, win-x64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Resolve version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish self-contained single file
        run: >
          dotnet publish src/Queuey.Client.Cli -c Release -r ${{ matrix.rid }}
          --self-contained -p:PublishSingleFile=true -p:Version=$VERSION
          -o publish/${{ matrix.rid }}

      - name: Archive
        # The published binary carries the assembly name (Queuey.Client.Cli);
        # ship it as `queuey` — the name every doc and script uses.
        run: |
          cd publish/${{ matrix.rid }}
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            mv Queuey.Client.Cli.exe queuey.exe
            zip -q "../../queuey-$VERSION-${{ matrix.rid }}.zip" queuey.exe
            cp "../../queuey-$VERSION-${{ matrix.rid }}.zip" "../../queuey-${{ matrix.rid }}.zip"
          else
            mv Queuey.Client.Cli queuey
            tar -czf "../../queuey-$VERSION-${{ matrix.rid }}.tar.gz" queuey
            cp "../../queuey-$VERSION-${{ matrix.rid }}.tar.gz" "../../queuey-${{ matrix.rid }}.tar.gz"
          fi

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            queuey-$VERSION-${{ matrix.rid }}.* queuey-${{ matrix.rid }}.* --clobber
