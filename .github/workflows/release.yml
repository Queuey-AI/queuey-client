name: Release

# Tag-driven publishing: push a tag like `v0.1.0-preview.6` and this
# (1) packs every packable project in the solution and pushes to NuGet.org,
# (2) publishes SELF-CONTAINED single-file `queuey` CLI binaries per
#     architecture and attaches them to a GitHub Release — the install path
#     for any machine with no .NET runtime at all: a Pi or a gateway, and just
#     as often a JavaScript developer's laptop running the agent-setup prompt
#     (`dotnet tool install` requires the SDK; neither usually has it).
#     Each binary is attached twice: versioned (queuey-0.1.0-preview.8-osx-arm64.tar.gz)
#     and under a stable name (queuey-osx-arm64.tar.gz), so that
#     releases/latest/download/queuey-<rid>.tar.gz is one URL the docs can hand
#     out that never goes stale.
#
# The version comes from the tag (overrides Directory.Build.props), but the tag
# must be the version that is committed: the deployment schema's $id
# (schema/queuey.deploy.schema.json) names the release tag of <Version>, and
# the test step builds with the tag's version, so a tag that is not the
# committed version fails the tests before anything is packed or published.
# A release is therefore: set <Version> in Directory.Build.props, regenerate
# the schema (QUEUEY_UPDATE_SCHEMA=1 dotnet test --filter DeploymentSchemaTests),
# merge that, then tag the merged commit `v<Version>` and push the tag.
#
# NuGet.org is reached through Trusted Publishing (OIDC): the job asks GitHub
# for a short-lived token, exchanges it at nuget.org for an API key that lives
# one hour, and pushes with that. No long-lived key is stored in this repo.
#
# The exchange only succeeds while a matching trusted publishing policy exists
# on nuget.org: owner Queuey-AI, repository queuey-client, workflow release.yml,
# no environment, scoped to the glob `Queuey.*`.
#
# Required variable: NUGET_USER (the nuget.org account name that registered the
# policy — a profile name, never an email address).
#
# --profile is smoke-tested before anything of its kind is published
# (scripts/smoke-profile.sh): the tool on the newest .NET runtime before the
# NuGet push, and each self-contained binary on a runner of its own platform
# before the binaries are attached. The connections file's owner is read
# through the runtime's native shim, which a single-file binary carries inside
# itself, so a build in which --profile does not work fails the release
# instead of the user.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release + upload assets

jobs:
  nuget:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # let GitHub mint the OIDC token nuget.org trades for a key
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Resolve version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Built with the tag's version, as the packages are: a tag that is not the
      # committed <Version> fails here (DeploymentSchemaTests), not after the push.
      - name: Test (the gate travels with the release)
        run: dotnet test Queuey.Client.sln --configuration Release -p:Version=$VERSION

      - name: Pack
        run: dotnet pack Queuey.Client.sln --configuration Release -o artifacts -p:Version=$VERSION

      # The tool runs on the newest runtime a machine has (RollForward=LatestMajor),
      # so --profile is tried there before the push. Bump this when a newer major
      # is released.
      - name: Setup the newest .NET runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Smoke-test --profile in the tool on the newest runtime
        run: |
          dotnet tool install Queuey.Cli --tool-path "$RUNNER_TEMP/queuey-tool" --add-source artifacts --version "$VERSION"
          scripts/smoke-profile.sh "$RUNNER_TEMP/queuey-tool/queuey"

      # The key expires an hour after it is issued, so it is fetched here —
      # after the slow test and pack steps — rather than at the top of the job.
      - name: NuGet login (OIDC exchange)
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  cli-binaries:
    # The binaries pass the same gate as the packages: nothing is attached to a
    # Release unless the tests passed with the tag's version.
    needs: nuget
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64, osx-arm64, osx-x64, win-x64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Resolve version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish self-contained single file
        run: >
          dotnet publish src/Queuey.Client.Cli -c Release -r ${{ matrix.rid }}
          --self-contained -p:PublishSingleFile=true -p:Version=$VERSION
          -o publish/${{ matrix.rid }}

      - name: Archive
        # The published binary carries the assembly name (Queuey.Client.Cli);
        # ship it as `queuey` — the name every doc and script uses.
        run: |
          cd publish/${{ matrix.rid }}
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            mv Queuey.Client.Cli.exe queuey.exe
            zip -q "../../queuey-$VERSION-${{ matrix.rid }}.zip" queuey.exe
            cp "../../queuey-$VERSION-${{ matrix.rid }}.zip" "../../queuey-${{ matrix.rid }}.zip"
          else
            mv Queuey.Client.Cli queuey
            tar -czf "../../queuey-$VERSION-${{ matrix.rid }}.tar.gz" queuey
            cp "../../queuey-$VERSION-${{ matrix.rid }}.tar.gz" "../../queuey-${{ matrix.rid }}.tar.gz"
          fi

      - name: Keep the archives for the smoke test and the release
        uses: actions/upload-artifact@v4
        with:
          name: queuey-${{ matrix.rid }}
          path: |
            queuey-${{ env.VERSION }}-${{ matrix.rid }}.*
            queuey-${{ matrix.rid }}.*
          if-no-files-found: error

  cli-smoke:
    # Each binary runs where it is meant to run before it is attached, with
    # --profile against a test profile (scripts/smoke-profile.sh). A binary in
    # which --profile does not work fails the release here. The publish job
    # cross-compiles every RID on Linux; only a runner of the binary's own
    # platform can run it.
    needs: cli-binaries
    strategy:
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-arm64
            os: macos-latest
          - rid: osx-x64
            os: macos-15-intel
          - rid: win-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: queuey-${{ matrix.rid }}
          path: dist

      - name: Unpack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive -Path "dist/queuey-${{ matrix.rid }}.zip" -DestinationPath bin

      - name: Unpack
        if: runner.os != 'Windows'
        run: |
          mkdir -p bin
          tar -xzf "dist/queuey-${{ matrix.rid }}.tar.gz" -C bin

      - name: Smoke-test --profile in the binary
        shell: bash
        run: scripts/smoke-profile.sh "bin/queuey${{ runner.os == 'Windows' && '.exe' || '' }}"

  cli-release:
    # Only binaries that passed their smoke test are attached.
    needs: cli-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: queuey-*
          path: dist
          merge-multiple: true

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" dist/* --clobber
