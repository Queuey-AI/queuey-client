# Mosquitto on the gateway, with Edge as its only subscriber. Mosquitto reads
# a comment only on a line of its own.

# Anonymous access is acceptable here because the broker is reachable only
# on the internal gateway network. Use a password_file once it is not.
listener 1883
allow_anonymous true

# Keep Edge's session and its queued messages across broker restarts. The
# broker writes them to disk every autosave_interval seconds: a power cut
# loses what it queued since the last write.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# The backlog lives here only while Edge stands back (its spool is full) or
# is down. Mosquitto's default is 1000 messages per session, then it drops.
persistent_client_expiration 30d
max_queued_messages 100000
max_queued_bytes 0
